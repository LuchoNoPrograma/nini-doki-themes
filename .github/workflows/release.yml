name: Publish release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        default: v1.1.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate
      - run: npm run sync:official
      - run: git diff --exit-code -- official
      - run: npm run bootstrap
      - run: npm run build
      - run: npm run test:hyper
      - name: Publish JetBrains and Hyper packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set +e
          for attempt in 1 2 3 4 5; do
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
              gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --title "Nini Doki Themes $RELEASE_TAG" --generate-notes
            gh release upload "$RELEASE_TAG" dist/*.zip \
              --repo "$GITHUB_REPOSITORY" --clobber && exit 0
            sleep $((attempt * 10))
          done
          exit 1
