name: Build packages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run bootstrap
      - run: npm run build
      - run: npm run test:hyper
      - uses: actions/upload-artifact@v4
        with:
          name: nini-doki-packages
          path: dist/*.zip
          if-no-files-found: error
